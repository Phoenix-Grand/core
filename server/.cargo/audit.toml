# Advisories `cargo audit` reports that this workspace cannot act on.
#
# An entry here is a claim that the vulnerable code is NOT reachable, and it
# must say why. Anything else - anything an upgrade can fix - gets upgraded.

[advisories]
ignore = [
  # rsa - Marvin attack (timing side-channel on RSA key operations).
  #
  # Reached only through `sqlx-mysql`, an OPTIONAL dependency of sqlx's macro
  # crate. This workspace enables PostgreSQL alone, so the MySQL driver is never
  # compiled: `cargo tree -e all -i rsa` finds nothing. It stays in Cargo.lock
  # because the resolver records optional dependencies of the packages it
  # resolves, not because anything builds it.
  #
  # Re-examine the day a MySQL backend is genuinely added.
  "RUSTSEC-2023-0071",
]
