[package]
name    = "kubuno-core"
version      = "0.1.15"
edition      = "2021"
authors      = ["Kubuno Contributors"]
license      = "AGPL-3.0"
repository   = "https://github.com/kubuno/core"

[[bin]]
name = "kubuno-core"
path = "src/main.rs"

[[bin]]
name = "kubuno"
path = "src/bin/kubuno/main.rs"

[lib]
name = "kubuno_core"
path = "src/lib.rs"

[dependencies]
tokio.workspace       = true
axum.workspace        = true
axum-server.workspace = true
rustls.workspace      = true
tower.workspace       = true
tower-http.workspace  = true
async-trait.workspace = true

sqlx.workspace        = true

serde.workspace       = true
serde_json.workspace  = true

jsonwebtoken.workspace = true
argon2.workspace       = true
aes-gcm.workspace      = true
rand.workspace         = true
sha2.workspace         = true
# Ed25519 verification for the signed catalogue manifest. `ring` is already in
# the tree (rustls, ACME): using it adds no new implementation to audit.
ring = "0.17"
hmac.workspace         = true
hkdf.workspace         = true
subtle.workspace       = true
base64.workspace       = true

reqwest.workspace   = true

config.workspace    = true
dotenvy.workspace   = true

validator.workspace = true
regex.workspace     = true

tracing.workspace            = true
tracing-subscriber.workspace = true
tracing-appender.workspace   = true

thiserror.workspace = true
anyhow.workspace    = true

uuid.workspace   = true
chrono.workspace = true
hickory-resolver.workspace = true
chrono-tz.workspace = true
ipnet.workspace  = true

bytes.workspace   = true
zip.workspace     = true
flate2.workspace  = true
futures.workspace = true
tokio-util.workspace = true
yrs.workspace     = true
hex.workspace     = true
toml.workspace    = true
totp-rs.workspace = true
clap.workspace    = true
url.workspace               = true
lettre.workspace            = true
ldap3.workspace              = true
rustls-pemfile.workspace     = true
rustls-native-certs.workspace = true
x509-parser.workspace        = true
instant-acme.workspace       = true
tokio-tungstenite.workspace = true
kubuno-storage.workspace    = true
kubuno-mcp.workspace        = true
kubuno-modauth.workspace    = true
kubuno-db.workspace         = true
kubuno-paths.workspace      = true
utoipa.workspace            = true

# POSIX only: `statvfs` and friends. Declared per platform because calling it
# unconditionally is what kept the server from compiling for Windows.
[target.'cfg(unix)'.dependencies]
libc.workspace   = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# ─── Workspace ───────────────────────────────────────────────────────────────
# The server is a workspace of its own (server/Cargo.lock, server/target). The shared crates live in
# ../common (their own workspace, published to the modules by git tag: db-v*, storage-v*, seccomp-v*,
# modauth-v*, vectors-v*) and are taken here by relative path. The desktop workspace is ../desktop.
[workspace]
resolver = "2"

[workspace.dependencies]
# Async
tokio       = { version = "1",    features = ["full"] }
# CRDT Yjs côté serveur (consolidation GC des snapshots collab)
yrs         = "0.23"
axum        = { version = "0.7",  features = ["macros", "ws", "multipart"] }
# HTTPS natif (terminaison TLS dans le core). default-features=false + ring pour
# rester aligné sur le provider crypto de sqlx (évite de tirer aws-lc-rs/C).
axum-server = { version = "0.7",  default-features = false, features = ["tls-rustls"] }
rustls      = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Certificate metadata (subject, SAN, validity) for the admin HTTPS panel. No
# cryptography of its own: rustls remains the sole TLS engine. (PEM parsing uses
# the existing `rustls-pemfile` dependency declared further down.)
x509-parser    = "0.18"
# ACME (Let's Encrypt) client for automatic certificates. ring only - NO
# aws-lc-rs (default features off) to keep the single ring provider the core
# already links; rcgen for the finalize key, hyper-rustls for the built-in
# client. Terminates over rustls, like everything else.
instant-acme   = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
tower       = { version = "0.5",  features = ["full"] }
tower-http  = { version = "0.6",  features = ["cors", "compression-gzip", "trace", "limit", "fs", "set-header", "timeout"] }
async-trait = "0.1"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "tls-rustls", "bigdecimal"] }

# Sérialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & Crypto
jsonwebtoken = "9"
argon2       = "0.5"
aes-gcm      = "0.10"
rand         = "0.8"
sha2         = "0.10"
hmac         = "0.12"
subtle       = "2"
hkdf         = "0.12"
base64       = "0.22"

# HTTP Client (pour proxy modules + CLI upload)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Config & Env
config  = "0.14"
dotenvy = "0.15"

# Validation
validator = { version = "0.21", features = ["derive"] }

# Logging & Tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"
tokio-util         = { version = "0.7", features = ["io"] }
kubuno-storage     = { path = "../common/kubuno-storage" }
kubuno-mcp         = { path = "../common/kubuno-mcp" }
kubuno-seccomp     = { path = "../common/kubuno-seccomp" }
kubuno-modauth     = { path = "../common/kubuno-modauth" }
kubuno-db          = { path = "../common/kubuno-db" }
kubuno-paths       = { path = "../common/kubuno-paths" }

# Erreurs
thiserror = "1"
anyhow    = "1"

# Regular expressions for the content detectors of `crate::rules::detect`.
# The crate is deliberately the automaton-based one rather than a backtracking
# engine: patterns are written by administrators and executed against content
# written by users, so linear-time matching has to be a property of the engine
# rather than of a review process. See `rules/detect/scan.rs`.
regex  = "1"

# Utils
uuid   = { version = "1", features = ["v4", "serde"] }
# CIDR matching for the trusted reverse-proxy list (client address resolution)
ipnet  = "2"
# `statvfs` only: the health checks need the free space of the data volume, and
# the standard library exposes no such API. Nothing here spawns a process - the
# seccomp filter still refuses `execve`/`execveat` (see kubuno-seccomp).
libc   = "0.2"
chrono = { version = "0.4", features = ["serde"] }
# The IANA time-zone database, compiled in. `chrono` alone converts to UTC and to
# the *system* zone and to nothing else, so stating an instant in the zone an
# operator chose (`instance.timezone`) needs the real table. Data, not a runtime:
# no file is read and nothing is spawned, which the seccomp filter requires.
chrono-tz = "0.10"
bytes   = "1"
futures = "0.3"
hex     = "0.4"
toml    = "0.8"
clap    = { version = "4", features = ["color", "wrap_help", "derive", "env"] }
url                 = "2"
urlencoding         = "2"
tokio-tungstenite   = { version = "0.24", features = ["native-tls"] }
async-stream        = "0.3"
totp-rs             = { version = "5", features = ["gen_secret", "otpauth"] }
zip                 = "2"
flate2              = "1"
quick-xml           = { version = "0.37", features = ["serialize"] }
utoipa              = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
# Outbound SMTP (crate::mailer). rustls rather than native-tls: the rest of the
# core's TLS is rustls (axum-server, sqlx), and OpenSSL has no business being
# linked in for one feature. `pool` is off - the core sends a handful of
# transactional messages, not a campaign.
lettre              = { version = "0.11", default-features = false, features = [
    "tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname",
] }
# LDAP / Active Directory client (crate::directory). Pure Rust - the seccomp
# filter forbids `execve`, so shelling out to `ldapsearch` was never an option.
# `ldap3` is the only maintained pure-Rust LDAPv3 client with async I/O,
# STARTTLS and LDAPS; `default-features = false` drops its blocking wrapper and
# its native-tls default, and `tls-rustls-ring` puts it on the very rustls 0.23
# + ring provider the rest of the core already links (axum-server, sqlx,
# lettre). One TLS stack, one certificate story, no OpenSSL.
ldap3               = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# DNS, for proving that somebody controls the domain they just declared.
#
# 0.25 rather than 0.26: the latter demands rustc 1.88 and this workspace states
# 1.82 as its floor - a dependency must not silently raise what the product
# claims to build on. Default features are exactly what is needed (tokio, plus
# the system resolver configuration read from /etc/resolv.conf).
hickory-resolver    = "0.26"
# Reading a private certificate authority supplied by the operator: `rustls` on
# its own parses no PEM. Same crate `rustls` itself recommends, no extra stack.
rustls-pemfile      = "2"
# The system trust store, so adding a private authority ADDS to the public roots
# instead of replacing them. Already in the tree (ldap3 pulls it); named here
# because `crate::directory::client` builds its own root store.
rustls-native-certs = "0.8"
