[package]
name         = "kubuno-mobile-account"
description  = "The Kubuno mobile account / network base (M2): the sign-in flow (login + TOTP, native client), the token owner that holds its own rotating refresh token in the OS secret store (no broker - the phone is the owner), and the typed Kubuno API client (reused from the desktop, rustls / no OpenSSL so it cross-compiles to Android and iOS)."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false

[dependencies]
kubuno-desktop-api-client = { workspace = true }
# The background runtime the apps run their network calls on (off the UI thread).
tokio       = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
# `log`: with no tracing subscriber, events are emitted as `log` records, which the Android shell sends to logcat.
tracing     = { version = "0.1", features = ["log"] }
async-trait = "0.1"
uuid        = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# The mock Kubuno auth server of the integration tests and of the on-device check (`examples/mock_server.rs`).
axum  = "0.7"
