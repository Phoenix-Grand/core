[package]
name         = "kubuno-mobile-signin"
description  = "The Kubuno mobile sign-in, shared by every app: the server / credentials / two-step screens (.kbview) and the flow that drives them over the account layer (kubuno-mobile-account) — server check, native sign-in, TOTP, then a session the app takes over."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false

[dependencies]
kubuno-mobile-render  = { workspace = true }
kubuno-mobile-account = { workspace = true }
log                   = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum  = "0.7"
serde_json = "1"
