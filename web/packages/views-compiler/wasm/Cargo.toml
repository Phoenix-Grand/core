# The WebAssembly build of the web `.kbview` compiler (vskubuno docs/WEB-VIEWS.md, WV-2).
#
# The compiler itself is the `kubuno-web-views-compiler-core` crate of Kubuno Desktop, in this repository's
# desktop/common (next to the shared grammar, `kubuno-desktop-views-syntax`; both were renamed on 2026-10-03, the
# dependency key stays `kubuno-views-web`). It is consumed here as a TAGGED git dependency of this same repository,
# like every shared crate ("published" mode): the `.wasm` is built from a released compiler, never from whatever
# the working tree holds. Its tags are `web-views-compiler-core-v<version>` (desktop/README.md, "Versions and tags"). This crate only adds a tiny C ABI (JSON in, JSON out) so the `.wasm`
# loads in Node and in the browser with no glue generator (no wasm-bindgen).
#
# The built `kubuno-views-web.wasm` is committed next to this file and shipped in the npm package: module
# builds (offline `.kbpkg` builds included) never need a Rust toolchain. Rebuild with
# `npm run build:wasm` (packages/views-compiler) — see scripts/build-wasm.mjs for the local-checkout override.
[package]
name    = "kubuno-views-compiler-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]
path       = "src/lib.rs"

[dependencies]
kubuno-views-web = { package = "kubuno-web-views-compiler-core", git = "https://github.com/kubuno/core", tag = "web-views-compiler-core-v0.2.3" }
# The `.kbres` model (WV-6: `.kbres` sets compiled to i18next bundles, the i18n converter): same repository and tag.
kubuno-resources-model = { package = "kubuno-desktop-resources-model", git = "https://github.com/kubuno/core", tag = "web-views-compiler-core-v0.2.3" }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

# Its own workspace: not a member of the core's Rust workspace (it only builds for wasm32).
[workspace]
