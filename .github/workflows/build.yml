name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history: build id needs the commit count

      # ── Backend (core) ──
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - name: cargo build
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --bin kubuno-core --bin kubuno

      # ── Frontend host ──
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build frontend host
        working-directory: web
        run: |
          npm ci
          npm run build

      # Sovereignty guard: the interface must not reference Google's font CDN in
      # ANY form - stylesheet imports, but also preconnect/dns-prefetch/<link>
      # hints, which runtime instrumentation (performance entries) cannot see.
      # The site's /security page invites visitors to verify this claim.
      - name: assert no Google font CDN references
        working-directory: web
        run: |
          if grep -RliE 'fonts\.googleapis\.com|fonts\.gstatic\.com' dist/; then
            echo '::error::Google font CDN reference found in built frontend - fonts must stay self-hosted'
            exit 1
          fi

      # ── Paquet Debian ──
      - name: build .deb
        run: bash build_deb.sh --no-install core
      - uses: actions/upload-artifact@v4
        with:
          name: kubuno-core-deb
          path: dist/*.deb

      # ── Release (sur tag v*) ──
      # Release notes come from CHANGELOG.md (section stamped by _tools/release.sh),
      # not from a commit summary: they are written when the change is made.
      - name: extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - "${GITHUB_REF_NAME#v}" << 'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          src = pathlib.Path('CHANGELOG.md')
          notes = ''
          if src.exists():
              text = src.read_text(encoding='utf-8')
              m = re.search(rf'^## \[{re.escape(version)}\][^\n]*$', text, re.M)
              if m:
                  rest = text[m.end():]
                  nxt = re.search(r'^## \[', rest, re.M)
                  chunk = rest[:nxt.start()] if nxt else rest
                  # Drop the trailing reference-link block ([1.2.3]: https://…)
                  notes = re.sub(r'(?m)^\[[^\]]+\]:\s*http\S*$', '', chunk).strip()
          pathlib.Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          print(notes or '(no notes for this version)')
          PY

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          body_path: RELEASE_NOTES.md
